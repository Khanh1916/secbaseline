set system services web-management https interface fxp0.0
set interfaces lo0 unit 0 family inet filter input PROTECT-RE
set firewall family inet filter PROTECT-RE term WEB from source-prefix-list MGMT-NETS
set firewall family inet filter PROTECT-RE term WEB from protocol tcp
set firewall family inet filter PROTECT-RE term WEB from destination-port https
set firewall family inet filter PROTECT-RE term WEB then accept
