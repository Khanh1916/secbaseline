name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: checklist/go.mod
          cache-dependency-path: checklist/go.sum

      - name: Format
        working-directory: checklist
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet and test
        working-directory: checklist
        run: |
          go vet ./...
          go test ./...

      # mawk is the default awk on Debian and Ubuntu, and in the container image;
      # gawk-only syntax (\s, three-argument match()) silently breaks checks there.
      - name: Network fixtures with mawk
        working-directory: checklist
        run: |
          sudo apt-get install -y -qq mawk >/dev/null
          mkdir -p "$RUNNER_TEMP/mawk" && ln -sf "$(command -v mawk)" "$RUNNER_TEMP/mawk/awk"
          PATH="$RUNNER_TEMP/mawk:$PATH" go test -count=1 ./runner -run TestNetworkFixtures

      - name: Cross-compile
        working-directory: checklist
        run: |
          for os in linux windows darwin; do
            GOOS=$os GOARCH=amd64 go build -o /dev/null . || exit 1
          done

      - name: Shell syntax
        run: |
          status=0
          for f in $(git ls-files '*.sh'); do bash -n "$f" || status=1; done
          exit $status

      - name: Lint catalog, scripts and READMEs
        run: |
          (cd checklist && go build -o /tmp/checklist .)
          /tmp/checklist lint

      - name: Audit sample network configurations
        run: |
          for pair in iosxe:iosxe/iosxe.cfg iosxe:iosxe/cat8k.cfg junos:junos/jsw.cfg iosxr:iosxr/asr9k.cfg nxos:nxos/n9k.cfg; do
            platform=${pair%%:*}; config=${pair#*:}
            /tmp/checklist run -p "$platform" -c "$config" -o report.json
            errors=$(jq '.summary.error' report.json)
            if [ "$errors" != "0" ]; then
              jq '.checks[] | select(.status == "error")' report.json
              exit 1
            fi
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: checklist/go.mod
          cache-dependency-path: checklist/go.sum

      - name: Test
        working-directory: checklist
        run: go test ./...

      - name: Every Windows check reads its setting
        shell: bash
        run: |
          (cd checklist && go build -o "$RUNNER_TEMP/checklist.exe" .)
          "$RUNNER_TEMP/checklist.exe" run -p windows --no-collectors -o "$RUNNER_TEMP/windows.json"
          jq -r '.checks[] | "\(.id) \(.status) \(.message // .error)"' "$RUNNER_TEMP/windows.json"
          jq -e '.summary.error == 0' "$RUNNER_TEMP/windows.json" >/dev/null
          # The runner is elevated, so secedit and auditpol must succeed.
          if jq -e '[.checks[] | select(.key | test("^windows[.](password|lockout|audit)[.]")) | select(.message | test("^Could not read"))] | length > 0' "$RUNNER_TEMP/windows.json" >/dev/null; then
            echo "checks could not read their setting on an elevated runner"; exit 1
          fi

      - name: Lint
        shell: bash
        run: |
          (cd checklist && go build -o "$RUNNER_TEMP/checklist.exe" .)
          "$RUNNER_TEMP/checklist.exe" lint

  distros:
    name: distro (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            image: ubuntu:24.04
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq telnetd
            control: linux.services.telnet_server_removed
          - platform: debian
            image: debian:12
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq telnetd
            control: linux.services.telnet_server_removed
          - platform: redhat
            image: registry.access.redhat.com/ubi9/ubi:latest
            install: dnf -y -q install httpd
            control: linux.services.http_server_removed
          - platform: rocky
            image: rockylinux:9
            install: dnf -y -q install telnet-server
            control: linux.services.telnet_server_removed
          - platform: centos
            image: quay.io/centos/centos:stream9
            install: dnf -y -q install telnet-server
            control: linux.services.telnet_server_removed
          - platform: oraclelinux
            image: oraclelinux:9
            install: dnf -y -q install telnet-server
            control: linux.services.telnet_server_removed
          - platform: suse
            image: opensuse/leap:15.6
            install: zypper -n -q install telnet-server
            control: linux.services.telnet_server_removed
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: checklist/go.mod
          cache-dependency-path: checklist/go.sum

      - name: Build
        working-directory: checklist
        run: CGO_ENABLED=0 go build -o /tmp/checklist .

      - name: Every check gives a verdict on ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/repo" -v /tmp/checklist:/usr/local/bin/checklist:ro -w /repo ${{ matrix.image }} \
            checklist run -p ${{ matrix.platform }} --no-collectors --timeout 90s -o /repo/before.json
          if ! jq -e '.summary.error == 0' before.json >/dev/null; then
            jq '.checks[] | select(.status == "error") | {id, key, error, output, stderr}' before.json
            exit 1
          fi
          jq -e '.checks[] | select(.key == "${{ matrix.control }}") | .status == "pass"' before.json

      - name: ${{ matrix.control }} fails once the package is installed
        run: |
          docker run --rm -v "$PWD:/repo" -v /tmp/checklist:/usr/local/bin/checklist:ro -w /repo ${{ matrix.image }} \
            bash -c '${{ matrix.install }} >/dev/null && checklist run -p ${{ matrix.platform }} --only ${{ matrix.control }} --no-collectors -o /repo/after.json'
          jq '.checks[0] | {id, status, message}' after.json
          jq -e '.checks[0].status == "fail"' after.json

      # Each case (<platform>/testdata/<id>/{pass,fail}-*.sh) sets up a new
      # container of the image and checks the verdict; see linux_cases_test.go.
      - name: Verdict cases on ${{ matrix.image }}
        working-directory: checklist
        shell: bash
        env:
          CHECKLIST_CASES_PLATFORM: ${{ matrix.platform }}
          CHECKLIST_CASES_IMAGE: ${{ matrix.image }}
        run: |
          go test -count=1 -timeout 60m -parallel 8 -run TestLinuxCases -v ./runner |
            grep -Ev '^ *(=== (RUN|PAUSE|CONT)|--- PASS)'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg VERSION=ci -t secbaseline:ci .

      - name: Lint and audit inside the image
        run: |
          docker run --rm secbaseline:ci version
          docker run --rm secbaseline:ci lint
          errors=$(docker run --rm -v "$PWD/nxos:/cfg:ro" secbaseline:ci \
            run -p nxos -c /cfg/n9k.cfg -o - 2>/dev/null | jq '.summary.error')
          test "$errors" = "0"

      - name: Dashboard starts and accepts a report
        run: |
          docker run -d --name dash -p 8080:8080 -e CHECKLIST_SERVER_TOKEN=ci-token \
            secbaseline:ci serve --listen 0.0.0.0:8080 --data /data
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          docker run --rm -v "$PWD/iosxe:/cfg:ro" --network host -e CHECKLIST_SERVER_TOKEN=ci-token secbaseline:ci \
            run -p iosxe -c /cfg/iosxe.cfg -o /dev/null --upload http://127.0.0.1:8080
          curl -fs -H "Authorization: Bearer ci-token" http://127.0.0.1:8080/api/subjects | jq -e 'length == 1'
          docker rm -f dash
