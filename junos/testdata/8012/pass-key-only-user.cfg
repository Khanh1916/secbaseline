set system login password change-type character-sets
set system login password minimum-length 12
set system login password format sha512
set system root-authentication encrypted-password "$6$abc"
set system login user admin uid 2000
set system login user admin class super-user
set system login user admin authentication encrypted-password "$6$def"
set system login user automation uid 2001
set system login user automation class operator
set system login user automation authentication ssh-ed25519 "ssh-ed25519 AAAAC3Nza automation@host"
