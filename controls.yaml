# Catalog of every check and collector in this repository.
#
# - platforms: where each platform's scripts live and how they are run.
# - controls:  one entry per control; `ids` maps platform -> script ID, the script being
#              <platform>/<id>.sh (or .ps1 on Windows).
# - collectors: inventory collectors built into the Go binary (checklist <id>).
#
# IDs are explicit because they do not line up by index across platform families:
# Ubuntu/Debian have no separate NIS client control, so from linux.clients.rsh_removed
# onward their IDs are one lower than the RHEL-family index. Oracle Linux has no
# collector IDs in checklist/main.go.
#
# Validate after editing: checklist lint

version: 1

platforms:
  ubuntu: {kind: linux, name: Ubuntu, detect: [ubuntu]}
  debian: {kind: linux, name: Debian, detect: [debian]}
  redhat: {kind: linux, name: Red Hat Enterprise Linux, detect: [rhel]}
  rocky: {kind: linux, name: Rocky Linux, detect: [rocky]}
  centos: {kind: linux, name: CentOS, detect: [centos]}
  suse: {kind: linux, name: SUSE Linux Enterprise / openSUSE, detect: [sles, sled, opensuse, opensuse-leap]}
  oraclelinux: {kind: linux, name: Oracle Linux, detect: [ol]}
  windows: {kind: windows, name: Microsoft Windows}
  iosxe: {kind: network, name: Cisco IOS XE}
  junos: {kind: network, name: Juniper Junos}
  iosxr: {kind: network, name: Cisco IOS XR}
  nxos: {kind: network, name: Cisco NX-OS}

